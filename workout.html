<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>5-Step Countdown Workout</title>
  <style>
    :root { --fg:#111; --muted:#666; --bg:#fff; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 48px; }

    .topbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
      padding: 10px 0 16px; border-bottom:1px solid #eee; margin-bottom: 14px;
    }
    label { font-weight: 700; }
    select {
      padding: 8px 10px; border-radius: 10px; border:1px solid #ccc; background:#fff;
      font-size: 16px;
    }
    button {
      border: 1px solid #ccc; background:#f7f7f7; padding: 10px 14px; border-radius: 10px;
      cursor:pointer; font-weight:700;
    }
    button:disabled{ opacity:0.5; cursor:not-allowed; }
    button:active { transform: translateY(1px); }

    #timer { font-size: 72px; font-weight: 900; text-align:center; letter-spacing: 1px; margin: 18px 0 4px; }
    #number { font-size: 96px; font-weight: 950; text-align:center; margin: 8px 0 18px; }

    #image { display:block; margin: 0 auto 16px; max-width: min(92vw, 760px); max-height: 52vh; object-fit: contain; }
    #desc { font-size: 22px; line-height: 1.35; text-align:center; margin: 0 auto; max-width: 65ch; }

    .meta { margin-top: 14px; text-align:center; color:var(--muted); font-size: 14px; }
    .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; background:#f2f2f2; }
    .controls { display:flex; gap:10px; justify-content:center; margin-top: 14px; flex-wrap: wrap; }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Chart/Level selection + generate -->
    <div class="topbar">
      <label for="chartSel">Chart</label>
      <select id="chartSel">
        <option value="1">Chart 1</option>
        <option value="2">Chart 2</option>
        <option value="3">Chart 3</option>
        <option value="4">Chart 4</option>
        <option value="5">Chart 5</option>
        <option value="6">Chart 6</option>
      </select>

      <label for="levelSel">Level</label>
      <select id="levelSel"></select>

      <button id="generateBtn">Generate 5 steps</button>
    </div>

    <!-- Display area -->
    <div id="timer">00:00</div>
    <div id="number">—</div>
    <img id="image" alt="Exercise image" src="" style="display:none;" />
    <div id="desc">Select a chart and level, then click “Generate 5 steps”.</div>

    <div class="meta">
      <span class="pill" id="stepLabel">Step 0 / 5</span>
      <span class="pill" id="chartLevelLabel" style="margin-left:8px;">Chart — Level —</span>
    </div>

    <div class="controls">
      <button id="startBtn" disabled>Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="skipBtn" disabled>Skip</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>
  </div>

<script>
/**
 * ───────────────────────────────────────────────────────────────
 * 1) TRANSCRIBED DATA GOES HERE
 *    Structure: CHARTS[chartNumber][levelLetter] = array of 5 step objects
 *    Step object format:
 *      { seconds: <number>, number: <number|string>, image: <string>, description: <string> }
 *
 * IMPORTANT:
 * - Paste your fully transcribed chart tables from your PDF into this object.
 * - Keep EXACTLY 5 entries per level.
 * - Use image paths that match your extracted PDF exercise images.
 *───────────────────────────────────────────────────────────────
 */
const CHARTS = {
  1: {
    // EXAMPLE ONLY — replace with your transcription
    A_Plus: [
      { seconds: 120,  number: 20,    image: "images/chart1/ex1.png", description: "Forward bend to floor then stretch upward and backward" },
      { seconds: 60,  number: 18,     image: "images/chart1/ex2.png", description: "Sit up to see heels" },
      { seconds: 60,  number: 18,     image: "images/chart1/ex3.png", description: "Raise head and one leg then the other" },
      { seconds: 60,  number: 13,     image: "images/chart1/ex4.png", description: "Straighten arms lifting upper body, keeping knees on floor the lower" },
      { seconds: 360, number: "400. Jumps every 75", image: "images/chart1/ex5.png", description: "Stationary run with 'scissor jumps'." }
    ],
    A: [
      { seconds: 120,  number: 18,    image: "images/chart1/ex1.png", description: "Forward bend to floor then stretch upward and backward" },
      { seconds: 60,  number: 17,     image: "images/chart1/ex2.png", description: "Sit up to see heels" },
      { seconds: 60,  number: 17,     image: "images/chart1/ex3.png", description: "Raise head and one leg then the other" },
      { seconds: 60,  number: 12,     image: "images/chart1/ex4.png", description: "Straighten arms lifting upper body, keeping knees on floor the lower" },
      { seconds: 360, number: "375. Jumps every 75", image: "images/chart1/ex5.png", description: "Stationary run with 'scissor jumps'." }
    ],
    A_Minus: [
      { seconds: 120,  number: 16,    image: "images/chart1/ex1.png", description: "Forward bend to floor then stretch upward and backward" },
      { seconds: 60,  number: 15,     image: "images/chart1/ex2.png", description: "Sit up to see heels" },
      { seconds: 60,  number: 16,     image: "images/chart1/ex3.png", description: "Raise head and one leg then the other" },
      { seconds: 60,  number: 11,     image: "images/chart1/ex4.png", description: "Straighten arms lifting upper body, keeping knees on floor the lower" },
      { seconds: 360, number: "335. Jumps every 75", image: "images/chart1/ex5.png", description: "Stationary run with 'scissor jumps'." }
    ]
    // B: [...], C: [...], etc.
  },
  2: {},
  3: {},
  4: {},
  5: {},
  6: {}
};

/**
 * ───────────────────────────────────────────────────────────────
 * 2) FUNCTION YOU ASKED FOR: chart + level → generate 5 JSON variables
 *    Returns an array of 5 step objects in order.
 * ───────────────────────────────────────────────────────────────
 */
function generateWorkoutSteps(chart, level) {
  const c = String(chart);
  const lvl = String(level).toUpperCase();

  if (!CHARTS[c]) {
    throw new Error(`Chart ${c} does not exist in CHARTS`);
  }
  if (!CHARTS[c][lvl]) {
    throw new Error(`Level ${lvl} does not exist in Chart ${c}`);
  }

  const steps = CHARTS[c][lvl];
  if (!Array.isArray(steps) || steps.length !== 5) {
    throw new Error(`Chart ${c} Level ${lvl} must contain exactly 5 steps`);
  }

  // Defensive copy + normalisation
  return steps.map((step, i) => {
    if (step == null || typeof step !== "object") {
      throw new Error(`Invalid step object at index ${i} for Chart ${c} Level ${lvl}`);
    }
    const seconds = Number(step.seconds);
    if (!Number.isFinite(seconds) || seconds < 0) {
      throw new Error(`Invalid seconds at step ${i+1} (Chart ${c} Level ${lvl})`);
    }
    return {
      seconds,
      number: step.number,
      image: step.image || "",
      description: step.description || ""
    };
  });
}

/**
 * ───────────────────────────────────────────────────────────────
 * 3) Countdown + sequencing engine (uses the generated steps)
 * ───────────────────────────────────────────────────────────────
 */
let steps = [];              // will be set by Generate button
let currentIndex = 0;
let remaining = 0;
let intervalId = null;
let running = false;

const timerEl = document.getElementById("timer");
const numEl   = document.getElementById("number");
const imgEl   = document.getElementById("image");
const descEl  = document.getElementById("desc");
const stepLabelEl = document.getElementById("stepLabel");
const chartLevelLabelEl = document.getElementById("chartLevelLabel");

const chartSel = document.getElementById("chartSel");
const levelSel = document.getElementById("levelSel");

const generateBtn = document.getElementById("generateBtn");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const skipBtn  = document.getElementById("skipBtn");
const resetBtn = document.getElementById("resetBtn");

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

function renderStep(index) {
  const step = steps[index];
  if (!step) return;

  remaining = step.seconds;

  timerEl.textContent = formatTime(remaining);
  numEl.textContent   = step.number;
  descEl.textContent  = step.description;

  imgEl.src = step.image || "";
  imgEl.style.display = step.image ? "block" : "none";

  stepLabelEl.textContent = `Step ${index + 1} / ${steps.length}`;
}

function tick() {
  remaining -= 1;
  timerEl.textContent = formatTime(remaining);
  if (remaining <= 0) advance();
}

function start() {
  if (running || steps.length !== 5) return;
  running = true;

  startBtn.disabled = true;
  pauseBtn.disabled = false;
  skipBtn.disabled  = false;

  intervalId = setInterval(tick, 1000);
}

function pause() {
  if (!running) return;
  running = false;

  clearInterval(intervalId);
  intervalId = null;

  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function stopAndClearInterval() {
  running = false;
  if (intervalId) clearInterval(intervalId);
  intervalId = null;
  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function advance() {
  stopAndClearInterval();

  currentIndex += 1;
  if (currentIndex >= steps.length) {
    timerEl.textContent = "00:00";
    numEl.textContent = "Done";
    descEl.textContent = "Sequence complete.";
    imgEl.style.display = "none";
    stepLabelEl.textContent = `Step ${steps.length} / ${steps.length}`;
    skipBtn.disabled = true;
    return;
  }

  renderStep(currentIndex);
  start(); // auto-start next step
}

function resetSequence() {
  stopAndClearInterval();
  currentIndex = 0;
  renderStep(currentIndex);
  skipBtn.disabled = false;
}

/**
 * ───────────────────────────────────────────────────────────────
 * 4) Wire chart → available levels list (auto-populate)
 * ───────────────────────────────────────────────────────────────
 */
function populateLevelsForSelectedChart() {
  const c = chartSel.value;
  const levelsObj = CHARTS[c] || {};
  const levelKeys = Object.keys(levelsObj).sort();

  levelSel.innerHTML = "";
  if (levelKeys.length === 0) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "(No levels loaded)";
    levelSel.appendChild(opt);
    levelSel.disabled = true;
  } else {
    levelSel.disabled = false;
    for (const lvl of levelKeys) {
      const opt = document.createElement("option");
      opt.value = lvl;
      opt.textContent = `Level ${lvl}`;
      levelSel.appendChild(opt);
    }
  }
}

chartSel.addEventListener("change", () => {
  populateLevelsForSelectedChart();
  // clear any previous generated sequence
  steps = [];
  currentIndex = 0;
  timerEl.textContent = "00:00";
  numEl.textContent = "—";
  imgEl.style.display = "none";
  descEl.textContent = "Select a chart and level, then click “Generate 5 steps”.";
  stepLabelEl.textContent = "Step 0 / 5";
  chartLevelLabelEl.textContent = `Chart ${chartSel.value} Level —`;
  startBtn.disabled = true;
  pauseBtn.disabled = true;
  skipBtn.disabled = true;
  resetBtn.disabled = true;
});

generateBtn.addEventListener("click", () => {
  try {
    const c = chartSel.value;
    const lvl = levelSel.value;
    const generated = generateWorkoutSteps(c, lvl);

    // Assign the 5 JSON variables (as you originally structured it)
    // They are available here if you need them explicitly:
    const step1 = generated[0];
    const step2 = generated[1];
    const step3 = generated[2];
    const step4 = generated[3];
    const step5 = generated[4];
    // (Not used directly; kept because you asked for “5 JSON variables”.)

    steps = generated;
    currentIndex = 0;
    renderStep(currentIndex);

    chartLevelLabelEl.textContent = `Chart ${c} Level ${lvl}`;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    skipBtn.disabled = false;
    resetBtn.disabled = false;

    descEl.textContent = steps[0].description || "(No description)";
  } catch (err) {
    // Minimal on-page error display (no alerts)
    steps = [];
    currentIndex = 0;
    stopAndClearInterval();
    timerEl.textContent = "00:00";
    numEl.textContent = "—";
    imgEl.style.display = "none";
    stepLabelEl.textContent = "Step 0 / 5";
    startBtn.disabled = true;
    pauseBtn.disabled = true;
    skipBtn.disabled = true;
    resetBtn.disabled = true;
    descEl.textContent = `Error: ${err.message}`;
  }
});

startBtn.addEventListener("click", start);
pauseBtn.addEventListener("click", pause);
skipBtn.addEventListener("click", () => { if (steps.length === 5) advance(); });
resetBtn.addEventListener("click", () => { if (steps.length === 5) resetSequence(); });

// Initial boot
populateLevelsForSelectedChart();
chartLevelLabelEl.textContent = `Chart ${chartSel.value} Level —`;
</script>
</body>
</html>
